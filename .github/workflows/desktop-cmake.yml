name: Desktop CMake

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    name: Windows MSVC
    runs-on: windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize required submodules
        run: >
          git -c protocol.version=2 submodule update --init --depth=1 --
          third_party/spirv-headers/src
          third_party/spirv-tools/src
          third_party/vulkan-headers/src
          third_party/vulkan_memory_allocator
          third_party/zlib

      - name: Set up MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure desktop-msvc preset
        run: cmake --preset desktop-msvc

      - name: Build public desktop libraries
        run: cmake --build out/cmake/desktop-msvc --target libANGLE libGLESv2 libEGL libGLESv1_CM

  windows-msys2:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MinGW GCC
            msystem: MINGW64
            preset: desktop-mingw
            packages: >-
              git
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-ninja
          - name: MinGW clang
            msystem: CLANG64
            preset: desktop-mingw-clang
            packages: >-
              git
              mingw-w64-clang-x86_64-clang
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-lld
              mingw-w64-clang-x86_64-ninja

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          path-type: strict
          install: ${{ matrix.packages }}

      - name: Initialize required submodules
        shell: msys2 {0}
        run: >
          git -c protocol.version=2 submodule update --init --depth=1 --
          third_party/spirv-headers/src
          third_party/spirv-tools/src
          third_party/vulkan-headers/src
          third_party/vulkan_memory_allocator
          third_party/zlib

      - name: Configure ${{ matrix.preset }} preset
        shell: msys2 {0}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build public desktop libraries
        shell: msys2 {0}
        run: cmake --build out/cmake/${{ matrix.preset }} --target libANGLE libGLESv2 libEGL libGLESv1_CM

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: X11
            preset: desktop-linux
            packages: >-
              libegl1-mesa-dev
              libgl1-mesa-dev
              libdrm-dev
              libx11-dev
              libxcb1-dev
              libxext-dev
              libxi-dev
              ninja-build
          - name: GBM/DRM
            preset: desktop-linux-gbm
            packages: >-
              libegl1-mesa-dev
              libgbm-dev
              libgl1-mesa-dev
              libdrm-dev
              ninja-build

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize required submodules
        run: >
          git -c protocol.version=2 submodule update --init --depth=1 --
          third_party/spirv-headers/src
          third_party/spirv-tools/src
          third_party/vulkan-headers/src
          third_party/vulkan_memory_allocator
          third_party/zlib

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Configure ${{ matrix.preset }} preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Build public desktop libraries
        run: cmake --build out/cmake/${{ matrix.preset }} --target libANGLE libGLESv2 libEGL libGLESv1_CM

  macos:
    name: macOS
    runs-on: macos-14

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize required submodules
        run: >
          git -c protocol.version=2 submodule update --init --depth=1 --
          third_party/spirv-headers/src
          third_party/spirv-tools/src
          third_party/vulkan-headers/src
          third_party/vulkan_memory_allocator
          third_party/zlib

      - name: Install Ninja
        run: brew install ninja

      - name: Configure desktop-macos preset
        run: cmake --preset desktop-macos

      - name: Build public desktop libraries
        run: cmake --build out/cmake/desktop-macos --target libANGLE libGLESv2 libEGL libGLESv1_CM